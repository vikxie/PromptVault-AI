
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | PromptVault AI</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="container nav-container">

      <a href="index.html" class="logo">
        PromptVault<span>AI.</span>
      </a>

      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="prompt-library.html">Prompt Library</a>
        <a href="categories.html">Categories</a>
        <a href="favourites.html">Favourites</a>
        <a href="ai-generator.html">AI Generator</a>
      </nav>

      <div class="nav-buttons">
        <a href="login.html" class="login-btn active">Login</a>
        <a href="signup.html" class="signup-btn">Get Started</a>
      </div>

    </div>
  </header>

  <!-- Login Section -->
  <section class="auth-section">

    <div class="auth-box">

      <div class="auth-logo">PromptVault<span>AI.</span></div>

      <h1>Welcome Back!</h1>

      <p class="auth-subtitle">
        Login to access your PromptVault AI account.
      </p>

      <form id="loginForm">

        <div class="auth-form-group">
          <label for="loginEmail">Email Address</label>
          <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
            required
          >
        </div>

        <div class="auth-form-group">
          <label for="loginPassword">Password</label>
          <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            required
            minlength="6"
          >
        </div>

        <button type="submit" class="auth-submit-btn">
          Login
        </button>

        <p id="loginMessage" class="auth-message" aria-live="polite"></p>

      </form>

      <p class="auth-switch">
        Don't have an account?
        <a href="signup.html">Create Account</a>
      </p>

      <a href="index.html" class="back-home">← Back to Home</a>

    </div>

  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>© 2026 PromptVault AI. All rights reserved.</p>
    </div>
  </footer>

  <script src="auth.js"></script>

</body>
</html>
